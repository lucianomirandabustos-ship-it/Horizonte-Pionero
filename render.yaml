services:
  - type: web
    name: horizonte-pionero-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn server:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DB_NAME
        value: horizonte_pionero
      - key: MASTER_DIRIGENTE_KEY
        value: ASB-HORIZONTE-2026
      - key: MONGODB_URI
        sync: false
